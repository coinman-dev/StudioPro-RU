RecordNow.Step4:
  Arm your tracks: Запиши ваши треки
  ? Pressing the [R] key on the keyboard or clicking the circle icon on the Track Controls arms the desired tracks. The monitor (speaker) icon will light up blue, indicating that the signal you&apos;re recording is routed to your speakers or headphones. Make sure not to arm tracks you don&apos;t want to record!
  : Клавиша [R] или значок круга на дорожке включают режим записи. Значок монитора загорится синим, если сигнал направлен на ваши мониторы или наушники. Не включайте запись на тех дорожках, которые не планируете записывать!
RecordNow.Step5:
  Click the Record button in the Transport controls or press [NumPad*] on the computer keyboard to activate recording.: Нажмите кнопку записи в элементах управления транспортировкой или нажмите [NumPad*] на клавиатуре компьютера, чтобы активировать запись.
  Start recording: Начать запись
RecordNow.Step6:
  Click here to learn more about how to record in Fender Studio Pro.: Нажмите здесь, чтобы узнать больше о записи в Fender Studio Pro.
  Learn more: Учить больше
