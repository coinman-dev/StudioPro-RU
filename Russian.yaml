GettingStarted.Step1:
  Welcome: Добро пожаловать
  ? Welcome and thank you for choosing Fender Studio Pro! This is the Start Page, your central location for managing documents and setting up your devices and Artist Profile. Let&apos;s take a look around...
  : Добро пожаловать и спасибо за выбор Fender Studio Pro! Это стартовая страница — ваш центр управления документами, настройки устройств и профиля артиста. Давайте осмотримся...
GettingStarted.Step2:
  Artist Profile: Профиль артиста
  ? This is your Artist Profile. You can add a profile picture via drag &amp; drop, and also enter a name, genre and web link. This meta information will be used to tag your documents.
  : Это ваш профиль исполнителя. Вы можете добавить изображение профиля с помощью перетаскивания, а также ввести имя, жанр и веб-ссылку. Эта метаинформация будет использоваться для маркировки ваших документов.
GettingStarted.Step3:
  Audio Device: Аудиоустройство
  ? Select your connected audio interface here. If you have a Fender or PreSonus audio interface, Fender Studio Pro will select it automatically.
  : Выберите здесь ваш аудиоинтерфейс. Устройства Fender или PreSonus определяются автоматически.
GettingStarted.Step4:
  ? Any other devices such as MIDI keyboards and controllers can be managed under External Devices. Controllers such as PreSonus FaderPort are added automatically.
  : Другие устройства (MIDI-клавиатуры и контроллеры) настраиваются в разделе . Контроллеры (например, FaderPort) добавляются автоматически.
  External Devices: Внешние устройства
GettingStarted.Step5:
  Quick switch: Быстрый переключатель
  These buttons allow you to quickly switch between the Start Page and any number of open documents.: Эти кнопки позволяют быстро переключаться между стартовой страницей и любым количеством открытых документов.
GettingStarted.Step6:
  Get creative: Проявите творческий подход
  ? Use these buttons to create or open documents, or collaborate with other Fender Studio Pro users. You can start from scratch or use the predefined Smart Templates.
  : Эти кнопки служат для создания/открытия документов или совместной работы. Можно начать с чистого листа или использовать .
GettingStarted.Step7:
  Click here for more tutorial videos to get up and running in no time.: Нажмите здесь для получения дополнительных обучающих видеороликов, чтобы начать работу в кратчайшие сроки.
  Learn more: Учить больше
