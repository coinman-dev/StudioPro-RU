DolbyAtmos.Step1:
  Mix in Dolby Atmos: Сведение в Dolby Atmos
  ? This tutorial takes you through the different stages of setting up Fender Studio Pro for spatial audio and creating your first mix in Dolby Atmos format.
  : Этот туториал проведет вас через этапы настройки Fender Studio Pro для работы со Spatial Audio и создания первого микса в формате Dolby Atmos.
DolbyAtmos.Step10:
  Click here to learn more about mixing in Dolby Atmos format.: Нажмите здесь, чтобы узнать больше о сведении в формате Dolby Atmos.
  Learn more: Узнать больше
DolbyAtmos.Step2:
  Audio I/O setup: Настройка Audio I/O
  ? When you upgrade your studio to spatial audio, make sure to adjust the Main output configuration to match your studio monitor setup. With a compatible audio interface, add a secondary stereo output for your headphones. This output is used for binaural monitoring.
  : При переходе на Spatial Audio настройте выход Main в соответствии с вашей конфигурацией мониторов. Для совместимых интерфейсов добавьте второй стереовыход для наушников (для бинаурального мониторинга).
DolbyAtmos.Step3:
  Session setup: Настройка сессии
  ? To change the mixer configuration to spatial audio and Dolby Atmos, open &apos;Spatial Audio&apos; from the Session menu, select &apos;Dolby Atmos&apos; mode and choose your prefered bed and output formats. 7.1.2 bed and 7.1.4 output are a good starting point.
  : Spatial Dolby , форматы Bed и Output. Конфигурации 7.1.2 для Bed и 7.1.4 для Output — хорошая точка отсчета.
DolbyAtmos.Step4:
  ? As soon as you click &apos;Apply&apos;, the Dolby Atmos Renderer opens, which is inserted in a custom slot of the Main output channel.
  : ' откроется Dolby Atmos Renderer, установленный в специальный слот основного выходного канала.'
  Renderer setup: Настройка Renderer
DolbyAtmos.Step5:
  ? Check the settings in the Renderer main menu and make sure these match your desired mixer and output configuration. For binaural headphone monitoring, set the Headphone Output to &apos;Binaural&apos;.
  : 'Проверьте настройки Renderer: они должны соответствовать вашей конфигурации микшера и выходов. Для бинаурального мониторинга установите .'
  Renderer setup: Настройка Renderer
DolbyAtmos.Step6:
  Bed and objects: Bed и объекты
  ? Channels in a Dolby Atmos mix are defined as either bed or objects. To change a channel to object, make sure it&apos;s routed to the Main output channel directly. Then select &apos;Spatial Object Panner&apos; from the channels&apos; Panner menu.
  : Каналы в Dolby Atmos — это либо Bed, либо объекты. Чтобы сделать канал объектом, направьте его напрямую на выход Spatial Object Panner\\\ в меню панорамирования канала.
DolbyAtmos.Step7:
  Audio export: Экспорт аудио
  ? When you&apos;re ready to export your Dolby Atmos mix, select &apos;Export Spatial Audio&apos; from the Session menu. In addition to the ADM Master file, you can export re-renders in additional formats.
  : Export Spatial  в меню Session. Помимо файла ADM Master, вы можете экспортировать ре-рендеры в другие форматы.
DolbyAtmos.Step8:
  Advanced - renderer configuration: 'Дополнительно: настройка Renderer'
  ? The Renderer default settings are perfect to start mixing right away. Click the Options button to reveal additional parameters. Here you can enable the loudness meter and create a dedicated parallel headphone output for binaural monitoring. Use the Volume knob to adjust overall level across all channels, both bed and objects.
  : 'Настройки Renderer по умолчанию позволяют сразу начать работу. Кнопка Options открывает доп. параметры: измеритель громкости и параллельный выход для бинаурального мониторинга. Регулятор Volume управляет общим уровнем всех каналов (Bed и объектов).'
DolbyAtmos.Step9:
  Advanced - plug-in routing: 'Дополнительно: маршрутизация плагинов'
  ? When mixing for Dolby Atmos in Fender Studio Pro, you don&apos;t need to worry about plug-in compatibility. Just use all your favorite plug-ins as before.
  : При сведении в Dolby Atmos в Fender Studio Pro не нужно беспокоиться о совместимости плагинов. Используйте свои любимые плагины как обычно.
