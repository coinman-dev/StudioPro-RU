LaunchLoops.Step1:
  Start with Splice sounds: Начните со звуков Splice
  ? Use Splice and the integrated Launcher to create music from loops in a new and intuitive way. Access Splice&apos;s entire catalog of royalty-free sounds, audition sounds synced to your session, and use them in any way you can imagine - all within your Fender Studio Pro session. Let&apos;s get started!
  : Используйте Splice и Launcher для интуитивного создания музыки из лупов. Пользуйтесь каталогом royalty-free звуков Splice, прослушивайте их в синхронизации с вашей сессией и воплощайте любые идеи прямо в Fender Studio Pro. Поехали!
LaunchLoops.Step10:
  ? Either convert the entire Playlist into an arrangement on the Timeline, or select &apos;Export Mixdown&apos; from the Session menu to export it to audio.
  : Преобразуйте плейлист в аранжировку на таймлайне или выберите Export Mixdown\\\ в меню сессии для экспорта в аудиофайл.
  Playlist export: Экспорт плейлиста
LaunchLoops.Step11:
  Click here to learn more about creating music from loops using the Launcher.: Нажмите здесь, чтобы узнать больше о создании музыки из лупов через Launcher.
  Learn more: Узнать больше
LaunchLoops.Step2:
  Setup Splice: Настройка Splice
  ? Splice is now integrated directly into the Browser. To access Splice, ensure the Splice Extension is installed. Click &apos;Install now&apos; on the Browser Home tab if you don&apos;t see the Splice tab.
  : Splice интегрирован в браузер. Для доступа убедитесь, что расширение Splice установлено. Если вкладка Install now\\\ на вкладке Browser Home.
LaunchLoops.Step3:
  Access the Splice library: Доступ к библиотеке Splice
  ? Download from thousands of hand-picked Splice samples included in Fender Studio Pro and access the entire catalog with a Splice account. Free 7-day trial available.
  : Скачивайте тысячи отобранных сэмплов Splice, включенных в Fender Studio Pro, или получите доступ ко всему каталогу через аккаунт Splice. Доступна пробная версия на 7 дней.
LaunchLoops.Step4:
  Discover compatible sounds with &apos;Search with Sound&apos;: ''
  Drop in audio or capture a selection within a track to instantly discover and use top compatible sounds for your session.: Перетащите аудио или выделите фрагмент на дорожке, чтобы мгновенно найти подходящие звуки для вашей сессии.
LaunchLoops.Step5:
  Add sounds from Splice: Добавление звуков из Splice
  ? Audition sounds in sync with your session&apos;s beat, key, and tempo. Using sounds is as easy as dragging them directly into your Launcher or Timeline.
  : Прослушивайте звуки в синхронизации с ритмом, тональностью и темпом сессии. Просто перетащите их в Launcher или на таймлайн.
LaunchLoops.Step6:
  Open the Launcher from the Toolbar. You can choose between Side-by-Side or Exclusive mode.: Откройте Launcher на панели инструментов. Доступны режимы Exclusive\\\ (эксклюзивно).
  Show Launcher: Показать Launcher
LaunchLoops.Step7:
  Launch Cells: Запуск ячеек
  Start or stop Cells directly from the Launcher using their Play and Stop buttons.: Запускайте и останавливайте ячейки прямо из Launcher кнопками Play и Stop.
LaunchLoops.Step8:
  Scenes: Сцены
  ? Scenes combine Cells on different Tracks playing together. Click the Scene Play button to launch a scene. In addition, you can drag Arranger Sections to Scenes and vice versa.
  : Сцены объединяют ячейки на разных дорожках. Нажмите Play в сцене для запуска. Секции аранжировщика можно перетаскивать в сцены и наоборот.
LaunchLoops.Step9:
  Playlists: Плейлисты
  ? Scene Playlists allow you to combine Scenes into arrangements. Once your Playlist is ready and active, simply drag Scenes to any position in the Playlists panel. Click the repetition counter to adjust the number of Scene repetitions.
  : Плейлисты сцен позволяют выстраивать сцены в аранжировку. Просто перетащите сцены в панель Playlists и укажите количество повторов для каждой сцены.
