  '&#8226; Fender products like guitars, basses, and amplifiers will be unregistered from the account': '&#8226; Продукты Fender (гитары, басы, усилители) будут отвязаны от аккаунта'
  ? '&#8226; It can no longer be used to log in to Fender websites and apps like Fender.com, Fender Play, Fender Tune, and Fender Studio'
  : '&#8226; Аккаунт нельзя будет использовать для входа на сайты и в приложения Fender (Fender.com, Play, Tune, Studio)'
  '&#8226; You will no longer be able to see your account&apos;s order history': '&#8226; Вы больше не сможете просматривать историю заказов'
  After you have cancelled your Fender Play subscription, you may continue with account deletion below.: После отмены подписки Fender Play вы сможете продолжить удаление аккаунта.
  Delete My Account: Удалить мой аккаунт
  Here you may request to have your Fender account deleted.: Здесь вы можете запросить удаление вашего аккаунта Fender.
  How do I cancel my subscription?: Как отменить подписку?
  'If you delete your account:': 'При удалении аккаунта:'
  It will take approximately 5 business days for your deletion to be processed.: Удаление будет обработано в течение примерно 5 рабочих дней.
  You must first cancel your Fender Play subscription before deletion of your Fender Connect account.: Перед удалением Fender Connect необходимо отменить подписку Fender Play.
