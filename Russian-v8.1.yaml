DolbyAtmos.Step1:
    Mix in Dolby Atmos: Микширование в Dolby Atmos
    ? This tutorial takes you through the different stages of setting up Fender Studio Pro for spatial audio and creating your first mix in Dolby Atmos format.
    : Это руководство проведёт вас через различные этапы настройки Fender Studio Pro для пространственного аудио и создания вашего первого микса в формате Dolby Atmos.
DolbyAtmos.Step10:
    Click here to learn more about mixing in Dolby Atmos format.: Нажмите здесь, чтобы узнать больше о микшировании в формате Dolby Atmos.
    Learn more: Узнать больше
DolbyAtmos.Step2:
    Audio I/O setup: Настройка аудио I/O
    ? When you upgrade your studio to spatial audio, make sure to adjust the Main output configuration to match your studio monitor setup. With a compatible audio interface, add a secondary stereo output for your headphones. This output is used for binaural monitoring.
    : При переходе студии на пространственное аудио обязательно настройте конфигурацию основного выхода в соответствии с расстановкой студийных мониторов. С совместимым аудиоинтерфейсом добавьте дополнительный стереовыход для наушников. Этот выход используется для бинаурального мониторинга.
DolbyAtmos.Step3:
    Session setup: Настройка сессии
    ? To change the mixer configuration to spatial audio and Dolby Atmos, open &apos;Spatial Audio&apos; from the Session menu, select &apos;Dolby Atmos&apos; mode and choose your prefered bed and output formats. 7.1.2 bed and 7.1.4 output are a good starting point.
    : Чтобы изменить конфигурацию микшера на пространственное аудио и Dolby Atmos, откройте &apos;Spatial Audio&apos; из меню «Сессия», выберите режим &apos;Dolby Atmos&apos; и нужные форматы bed и выхода. Bed 7.1.2 и выход 7.1.4 — хорошая отправная точка.
DolbyAtmos.Step4:
    ? As soon as you click &apos;Apply&apos;, the Dolby Atmos Renderer opens, which is inserted in a custom slot of the Main output channel.
    : Как только вы нажмёте &apos;Apply&apos;, откроется Dolby Atmos Renderer, вставленный в пользовательский слот основного выходного канала.
    Renderer setup: Настройка рендерера
DolbyAtmos.Step5:
    ? Check the settings in the Renderer main menu and make sure these match your desired mixer and output configuration. For binaural headphone monitoring, set the Headphone Output to &apos;Binaural&apos;.
    : Проверьте настройки в главном меню рендерера и убедитесь, что они соответствуют желаемой конфигурации микшера и выхода. Для бинаурального мониторинга в наушниках установите Headphone Output в &apos;Binaural&apos;.
    Renderer setup: Настройка рендерера
DolbyAtmos.Step6:
    Bed and objects: Bed и объекты
    ? Channels in a Dolby Atmos mix are defined as either bed or objects. To change a channel to object, make sure it&apos;s routed to the Main output channel directly. Then select &apos;Spatial Object Panner&apos; from the channels&apos; Panner menu.
    : Каналы в миксе Dolby Atmos определяются как bed или объекты. Чтобы сделать канал объектом, убедитесь, что он направлен напрямую на основной выходной канал. Затем выберите &apos;Spatial Object Panner&apos; в меню Panner канала.
DolbyAtmos.Step7:
    Audio export: Экспорт аудио
    ? When you&apos;re ready to export your Dolby Atmos mix, select &apos;Export Spatial Audio&apos; from the Session menu. In addition to the ADM Master file, you can export re-renders in additional formats.
    : Когда вы готовы экспортировать микс Dolby Atmos, выберите &apos;Export Spatial Audio&apos; из меню «Сессия». Помимо мастер-файла ADM, вы можете экспортировать ре-рендеры в дополнительных форматах.
DolbyAtmos.Step8:
    Advanced - renderer configuration: Дополнительно — конфигурация рендерера
    ? The Renderer default settings are perfect to start mixing right away. Click the Options button to reveal additional parameters. Here you can enable the loudness meter and create a dedicated parallel headphone output for binaural monitoring. Use the Volume knob to adjust overall level across all channels, both bed and objects.
    : Настройки рендерера по умолчанию идеально подходят, чтобы сразу начать микширование. Нажмите кнопку «Опции», чтобы открыть дополнительные параметры. Здесь можно включить измеритель громкости и создать отдельный параллельный выход на наушники для бинаурального мониторинга. Используйте регулятор Volume для настройки общего уровня всех каналов — и bed, и объектов.
DolbyAtmos.Step9:
    Advanced - plug-in routing: Дополнительно — маршрутизация плагинов
    ? When mixing for Dolby Atmos in Fender Studio Pro, you don&apos;t need to worry about plug-in compatibility. Just use all your favorite plug-ins as before.
    : При микшировании для Dolby Atmos в Fender Studio Pro не нужно беспокоиться о совместимости плагинов. Просто используйте все любимые плагины как раньше.
