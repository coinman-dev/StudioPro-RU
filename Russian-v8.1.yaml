CreateContent.Step1:
    Create Content: Создание контента
    ? Record and produce online content such as audiobooks, voiceover and podcasts - with or without video. Let&apos;s take a look...
    : Записывайте и создавайте онлайн-контент, такой как аудиокниги, закадровый голос и подкасты — с видео или без него. Давайте взглянем...
CreateContent.Step2:
    Select your input channel: Выберите входной канал
    ? Set the Input and Output (I/O) Channels of an Audio Track from the Track Controls to assign your audio interface inputs and outputs.
    : Установите входные и выходные (I/O) каналы аудиодорожки в элементах управления дорожкой, чтобы назначить входы и выходы аудиоинтерфейса.
CreateContent.Step3:
    ? Adjust the input level using the input gain control on your audio interface. When clipping occurs, reduce the input gain/level on your audio interface.
    : Отрегулируйте уровень входного сигнала с помощью регулятора усиления входного сигнала на аудиоинтерфейсе. Когда происходит отсечение, уменьшите входное усиление/уровень на аудиоинтерфейсе.
    Set your input level: Установите уровень входного сигнала
CreateContent.Step4:
    Import media: Импорт носителей
    ? You can import various media by simply dragging files to the Arrangement from the Browser. Drag audio files to the &apos;Music &amp; FX&apos; audio track and video files to the Video Track.
    : Вы можете импортировать различные медиафайлы, просто перетаскивая файлы в аранжировку из браузера. Перетащите аудиофайлы на аудиодорожку «Музыка и эффекты», а видеофайлы — на видеодорожку.
