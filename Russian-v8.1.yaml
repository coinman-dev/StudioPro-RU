    Use this template to record audio on a single track or multiple tracks and capture your ideas. Let&apos;s take a look...: Используйте этот шаблон для записи звука на одну или несколько дорожек и воплощения ваших идей. Давайте взглянем...
RecordNow.Step2:
    Select your input channel: Выберите входной канал
    ? Set the Input and Output (I/O) Channels of an Audio Track from the Track Controls to assign your audio interface inputs and outputs.
    : Установите входные и выходные (I/O) каналы аудиодорожки в элементах управления дорожкой, чтобы назначить входы и выходы аудиоинтерфейса.
RecordNow.Step3:
    ? Adjust the input level using the input gain control on your audio interface. When clipping occurs, reduce the input gain/level on your audio interface.
    : Отрегулируйте уровень входного сигнала с помощью регулятора усиления входного сигнала на аудиоинтерфейсе. Когда происходит отсечение, уменьшите входное усиление/уровень на аудиоинтерфейсе.
    Set your input level: Установите уровень входного сигнала
RecordNow.Step4:
    Arm your tracks: Запиши ваши треки
    ? Pressing the [R] key on the keyboard or clicking the circle icon on the Track Controls arms the desired tracks. The monitor (speaker) icon will light up blue, indicating that the signal you&apos;re recording is routed to your speakers or headphones. Make sure not to arm tracks you don&apos;t want to record!
    : Нажатие клавиши [R] на клавиатуре или клик по значку круга в элементах управления треком переводит нужные треки в режим записи. Значок монитора (динамика) загорится синим, указывая, что записываемый сигнал направлен на ваши динамики или наушники. Не включайте режим записи на треках, которые вы не хотите записывать!
