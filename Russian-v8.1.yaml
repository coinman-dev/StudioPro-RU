    ? '&apos;Get Some Air&apos; is a collaboration between Grammy-winning record producer, DJ Jazzy Jeff, rising emcee, UHMEER, and Chicago-based Hip-Hop/Soul producer RMB Justize.'
    : '&apos;Get Some Air&apos; — это совместная работа обладателя Grammy продюсера DJ Jazzy Jeff, восходящего эмси UHMEER и чикагского Hip-Hop/Soul продюсера RMB Justize.'
    ? '&apos;In Case You Forgot&apos; is a masterclass in intelligent indie rock - a track where the technicality of math rock meets the heartfelt core of emo, all wrapped in the infectious sensibilities of indie and math-pop.'
    : '&apos;In Case You Forgot&apos; — мастер-класс по интеллектуальному инди-року: трек, где техничность мат-рока встречается с искренней сутью эмо, обёрнутый в заразительную чувственность инди и мат-попа.'
