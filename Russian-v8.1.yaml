ProduceBeats.Step1:
    Produce Beats: Производство битов
    Want to create an awesome beat with just a few clicks? Then look no further than this Beat Making Template!: Хотите создать потрясающий бит всего за несколько кликов? Тогда обратите внимание на этот шаблон для создания битов!
ProduceBeats.Step2:
    Enter notes: Ввод нот
    ? 'You can enter notes or rhythms for any Instrument currently selected in the Track List, either manually by clicking any of the steps inside the grid, or by using the convenient shortcut buttons (example: &apos;Set every 4th Step&apos;).'
    : 'Вы можете вводить ноты или ритмы для любого инструмента, выбранного в данный момент в списке дорожек, либо вручную, щелкнув любой из шагов внутри сетки, либо с помощью удобных кнопок быстрого доступа (например: «Установить каждый 4-й шаг»).'
ProduceBeats.Step3:
    Change step length: Изменение длины шага
    Each Lane has its own step length. Combining different lengths inside a Pattern creates interesting polymeters.: Каждая полоса имеет свою собственную длину шага. Комбинирование различных длин внутри узора создает интересные полиметры.
ProduceBeats.Step4:
    Automate steps: Автоматизировать шаги
    ? You can adjust parameters such as Velocity, Probability, Repeats, and Delay (for subtle timing shifts) per Sample and/or Step. These modifications are accessible from the Automation Lanes view. It can be accessed from the highlighted button.
    : Вы можете настроить такие параметры, как Velocity, Probability, Repeats и Delay (для тонких временных сдвигов) для каждого сэмпла и/или шага. Эти модификации доступны в представлении «Дорожки автоматизации». Доступ к нему можно получить с помощью выделенной кнопки.
ProduceBeats.Step5:
    Create variations: Создавайте вариации
    ? Inside a Pattern you can create an unlimited number of Variations. Create, duplicate or delete Variations with a single click.
    : Внутри узора вы можете создавать неограниченное количество вариаций. Создавайте, дублируйте или удаляйте варианты одним щелчком мыши.
