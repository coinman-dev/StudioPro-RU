LaunchLoops.Step1:
    Start with Splice sounds: Начните со звуков Splice
    ? Use Splice and the integrated Launcher to create music from loops in a new and intuitive way. Access Splice&apos;s entire catalog of royalty-free sounds, audition sounds synced to your session, and use them in any way you can imagine - all within your Fender Studio Pro session. Let&apos;s get started!
    : Используйте Splice и встроенный Launcher, чтобы создавать музыку из лупов новым и интуитивным способом. Получите доступ ко всему каталогу royalty-free звуков Splice, прослушивайте звуки в синхронизации с вашей сессией и используйте их так, как только можете представить — всё это прямо в вашей сессии Fender Studio Pro. Давайте начнём!
LaunchLoops.Step10:
    ? Either convert the entire Playlist into an arrangement on the Timeline, or select &apos;Export Mixdown&apos; from the Session menu to export it to audio.
    : Либо преобразуйте весь плейлист в аранжировку на таймлайне, либо выберите &apos;Export Mixdown&apos; в меню Session, чтобы экспортировать его в аудио.
    Playlist export: Экспорт плейлиста
LaunchLoops.Step11:
    Click here to learn more about creating music from loops using the Launcher.: Нажмите здесь, чтобы узнать больше о создании музыки из лупов с помощью Launcher.
    Learn more: Узнать больше
LaunchLoops.Step2:
    Setup Splice: Настройка Splice
    ? Splice is now integrated directly into the Browser. To access Splice, ensure the Splice Extension is installed. Click &apos;Install now&apos; on the Browser Home tab if you don&apos;t see the Splice tab.
    : Splice теперь встроен прямо в браузер. Чтобы получить доступ к Splice, убедитесь, что расширение Splice установлено. Нажмите &apos;Install now&apos; на вкладке Home в браузере, если вы не видите вкладку Splice.
LaunchLoops.Step3:
    Access the Splice library: Доступ к библиотеке Splice
    ? Download from thousands of hand-picked Splice samples included in Fender Studio Pro and access the entire catalog with a Splice account. Free 7-day trial available.
    : Загружайте из тысяч отобранных вручную сэмплов Splice, входящих в Fender Studio Pro, и получите доступ ко всему каталогу с аккаунтом Splice. Доступна бесплатная 7-дневная пробная версия.
LaunchLoops.Step4:
    Discover compatible sounds with &apos;Search with Sound&apos;: Находите подходящие звуки с помощью &apos;Search with Sound&apos;
    Drop in audio or capture a selection within a track to instantly discover and use top compatible sounds for your session.: Перетащите аудио или захватите выделение внутри трека, чтобы мгновенно находить и использовать лучшие подходящие звуки для вашей сессии.
LaunchLoops.Step5:
    Add sounds from Splice: Добавляйте звуки из Splice
    ? Audition sounds in sync with your session&apos;s beat, key, and tempo. Using sounds is as easy as dragging them directly into your Launcher or Timeline.
    : Прослушивайте звуки в синхронизации с долей, тональностью и темпом вашей сессии. Использовать звуки так же просто, как перетащить их прямо в Launcher или на таймлайн.
LaunchLoops.Step6:
    Open the Launcher from the Toolbar. You can choose between Side-by-Side or Exclusive mode.: Откройте Launcher на панели инструментов. Вы можете выбрать режим Side-by-Side или Exclusive.
    Show Launcher: Показать Launcher
LaunchLoops.Step7:
    Launch Cells: Запуск ячеек
    Start or stop Cells directly from the Launcher using their Play and Stop buttons.: Запускайте или останавливайте ячейки прямо из Launcher с помощью их кнопок Play и Stop.
LaunchLoops.Step8:
    Scenes: Сцены
    ? Scenes combine Cells on different Tracks playing together. Click the Scene Play button to launch a scene. In addition, you can drag Arranger Sections to Scenes and vice versa.
    : Сцены объединяют ячейки на разных треках, играющие вместе. Нажмите кнопку Play сцены, чтобы запустить сцену. Кроме того, вы можете перетаскивать разделы аранжировщика в сцены и наоборот.
LaunchLoops.Step9:
    Playlists: Плейлисты
    ? Scene Playlists allow you to combine Scenes into arrangements. Once your Playlist is ready and active, simply drag Scenes to any position in the Playlists panel. Click the repetition counter to adjust the number of Scene repetitions.
    : Плейлисты сцен позволяют объединять сцены в аранжировки. Когда ваш плейлист готов и активен, просто перетащите сцены в любую позицию на панели плейлистов. Нажмите счётчик повторов, чтобы настроить число повторений сцены.
